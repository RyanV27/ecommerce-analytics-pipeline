# Vertex AI CustomJobSpec for ml/repeat_purchase_model.py.
# Ephemeral run — submitted at runtime via submit_vertex_jobs.ps1, not by
# Terraform. Placeholders (__TOKEN__) are substituted by that script before
# `gcloud ai custom-jobs create --display-name=... --config=<this file>`.
# CPU-only: XGBoost needs no GPU.
serviceAccount: __ML_TRAINING_SA__
workerPoolSpecs:
  - machineSpec:
      machineType: n1-standard-4
    replicaCount: 1
    containerSpec:
      imageUri: gcr.io/__PROJECT_ID__/datapulse-ml
      args:
        - ml/repeat_purchase_model.py
      env:
        - name: GCP_PROJECT_ID
          value: __PROJECT_ID__
        - name: MLFLOW_TRACKING_URI
          value: __MLFLOW_TRACKING_URI__
