# Vertex AI CustomJobSpec for ml/repeat_purchase_model.py.
# Ephemeral run, not managed by Terraform. Two submitters share this exact
# template as their single source of truth: the retrain_models DAG (Python
# aiplatform SDK, airflow/dags/retrain_models.py) and the manual/Windows-dev
# path (infra/submit_vertex_repeat_job.ps1, which still renders + calls
# `gcloud ai custom-jobs create` directly). Placeholders (__TOKEN__) are
# substituted by whichever path is submitting.
# CPU-only: XGBoost needs no GPU.
serviceAccount: __ML_TRAINING_SA__
workerPoolSpecs:
  - machineSpec:
      machineType: n1-standard-4
    replicaCount: 1
    containerSpec:
      imageUri: gcr.io/__PROJECT_ID__/datapulse-ml
      args:
        - ml/repeat_purchase_model.py
      env:
        - name: GCP_PROJECT_ID
          value: __PROJECT_ID__
        - name: MLFLOW_TRACKING_URI
          value: __MLFLOW_TRACKING_URI__
