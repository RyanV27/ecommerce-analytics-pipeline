name: Deploy Dashboard to Cloud Run

on:
  push:
    branches: [main]
    paths:
      - 'dashboard/**'
      - 'ab_testing/**'
      - '.github/workflows/deploy.yml'

permissions:
  contents: read
  id-token: write   # required for Workload Identity Federation OIDC token

jobs:
  deploy:
    name: Build and deploy datapulse-dashboard
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud (Workload Identity Federation)
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      - name: Set up gcloud CLI
        uses: google-github-actions/setup-gcloud@v2

      - name: Build container with Cloud Build
        run: |
          gcloud builds submit . \
            --config cloudbuild.yaml \
            --project ${{ secrets.GCP_PROJECT_ID }}

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy datapulse-dashboard \
            --image gcr.io/${{ secrets.GCP_PROJECT_ID }}/datapulse-dashboard \
            --region us-central1 \
            --platform managed \
            --allow-unauthenticated \
            --memory 1Gi \
            --set-env-vars GCP_PROJECT_ID=${{ secrets.GCP_PROJECT_ID }} \
            --project ${{ secrets.GCP_PROJECT_ID }}

      - name: Print service URL
        run: |
          gcloud run services describe datapulse-dashboard \
            --region us-central1 \
            --project ${{ secrets.GCP_PROJECT_ID }} \
            --format "value(status.url)"
